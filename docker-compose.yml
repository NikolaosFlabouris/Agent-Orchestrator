# Near-out-of-the-box single-machine package: bundles Forgejo, defaults every
# URL to localhost / compose service names (no IP editing), auto-generates the
# cookie secret on first boot, and auto-registers webhooks.
#
# Before first boot:
#   1. cp .env.example .env
#   2. docker compose up -d --build forgejo   (bring up the bundled Forgejo at
#                                              http://localhost:3000), then in
#                                              Forgejo create the OAuth2 app
#                                              (redirect http://localhost:8081/auth/callback)
#                                              + two service-account tokens and
#                                              drop them + one LLM key into .env
#   3. docker compose up -d --build           (builds the orchestrator + agent
#                                              `orchestrator-agent:latest` images,
#                                              creates the `agent-network` bridge,
#                                              and starts Forgejo + orchestrator —
#                                              first boot seeds providers/models/
#                                              default profile)
# See docs/quick-start.md for the full bring-up procedure.

services:
  # Build-only service. Produces the `orchestrator-agent:latest` image that
  # the orchestrator spawns task containers from at run-time. The container
  # itself executes `true` and exits 0 immediately — we only care about the
  # image being tagged in Docker's local image store. The orchestrator
  # service `depends_on` this with `service_completed_successfully`, so
  # `docker compose up -d --build` blocks on the build before starting the
  # orchestrator. Prevents the "no such image: orchestrator-agent:latest"
  # 404 that used to bite operators who hadn't run the separate build
  # script before `compose up`.
  #
  # Use `docker compose build agent-image` to force-rebuild without
  # touching the running orchestrator (e.g. after editing
  # images/agent/Dockerfile or harness/*).
  agent-image:
    image: orchestrator-agent:latest
    build:
      context: .
      dockerfile: images/agent/Dockerfile
    command: ["true"]
    restart: "no"

  orchestrator:
    build: .
    container_name: orchestrator
    restart: unless-stopped
    # stop_grace_period must be >= agent_timeout_minutes + a few minutes of drain slack.
    # If you raise agent_timeout_minutes in the UI, raise this too and `docker compose up -d`.
    stop_grace_period: 35m
    # Default to a loopback publish so an unconfigured instance can't be
    # reached from the LAN. The orchestrator itself also forces a
    # 127.0.0.1 bind inside the container when auth is disabled OR the
    # cookie secret is the dev fallback (see packages/server/src/index.ts
    # resolveBindHost) — this compose-level loopback publish is the
    # belt-and-braces layer for the case where someone misconfigures one
    # of those checks.
    #
    # To expose to the LAN (multi-user install with OAuth configured),
    # change to:
    #   - "0.0.0.0:8081:8080"
    # and also set ORCHESTRATOR_BIND_HOST=0.0.0.0 in .env. Both layers
    # must opt in; either one alone keeps you on loopback.
    ports:
      - "0.0.0.0:8081:8080"
    # Wait for the agent-image build to complete before the orchestrator
    # boots. If we didn't, the orchestrator could come up and accept task
    # creations before the agent image was tagged, and the first task to
    # try to launch would 404 on the missing image.
    depends_on:
      agent-image:
        condition: service_completed_successfully
      forgejo:
        condition: service_started
    # Two-tier URL defaults wired in here so a `git clone` + `docker compose
    # up` works with NO IP/URL editing. Each is overridable from `.env` (the
    # same file backs both `env_file` below and compose interpolation), so an
    # external-Forgejo or LAN deploy just sets the vars there.
    #   * Browser-facing  : ORCHESTRATOR_URL, FORGEJO_PUBLIC_URL  → localhost
    #   * Container-facing : ORCHESTRATOR_INTERNAL_URL, FORGEJO_URL → service names
    # MCP_ENABLED defaults on so the create-task plugin works out of the box.
    environment:
      - ORCHESTRATOR_URL=${ORCHESTRATOR_URL:-http://localhost:8081}
      - ORCHESTRATOR_INTERNAL_URL=${ORCHESTRATOR_INTERNAL_URL:-http://orchestrator:8080}
      - FORGEJO_URL=${FORGEJO_URL:-http://forgejo:3000}
      - FORGEJO_PUBLIC_URL=${FORGEJO_PUBLIC_URL:-http://localhost:3000}
      - MCP_ENABLED=${MCP_ENABLED:-1}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - orchestrator-data:/data
      # /workspaces and /caches are bind mounts (NOT named volumes) because the
      # orchestrator passes its in-container `/workspaces/issue-N` path through
      # the Docker socket as the source of agent-container bind mounts. The
      # Docker daemon interprets that source as a HOST path. With a named
      # volume, the host has no `/workspaces/...` and Docker silently creates
      # an empty directory — agents launch with an empty /repo and immediately
      # fail. With a bind mount, the orchestrator's `/workspaces` is the same
      # filesystem path on the host, so the agent sees the actual workspace.
      # The host directories are gitignored.
      - ./workspaces:/workspaces
      - ./caches:/caches
    env_file:
      - .env

  # Bundled Forgejo — the default git host. This makes the orchestrator a
  # near-out-of-the-box single-machine package: `docker compose up` brings up
  # Forgejo too, reachable by the host browser at http://localhost:3000 and by
  # the orchestrator container at http://forgejo:3000 (compose service name).
  #
  # Image is pinned to the same major as test/docker-compose.test.yml.
  #
  # ROOT_URL must match FORGEJO_PUBLIC_URL so the OIDC id_token `iss` validates
  # during UI login (split-horizon OIDC — see the two-tier URL note in .env.example).
  #
  # External-Forgejo escape hatch: to point at a Forgejo you run elsewhere,
  # set FORGEJO_URL / FORGEJO_PUBLIC_URL in `.env` (use
  # http://host.docker.internal:3000 for a host-run Forgejo on Docker Desktop)
  # and start only the orchestrator: `docker compose up -d orchestrator`
  # without `forgejo` — but note the orchestrator `depends_on: forgejo`, so to
  # fully skip the bundled instance run `docker compose up -d --no-deps orchestrator`.
  forgejo:
    image: codeberg.org/forgejo/forgejo:14
    container_name: forgejo
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
      # Forgejo reads ini settings from FORGEJO__<section>__<KEY> env vars.
      - FORGEJO__server__ROOT_URL=${FORGEJO_PUBLIC_URL:-http://localhost:3000}
    volumes:
      - forgejo-data:/data
    ports:
      - "3000:3000"

# No `networks:` block — the orchestrator runs on compose's default
# project network (for its own outbound traffic to Forgejo / LLM
# endpoints) and that's all it needs. The `agent-network` bridge that
# orchestrator-spawned agent containers attach to is created at
# orchestrator startup by `ensureAgentNetwork()` in docker.ts —
# entirely outside compose's lifecycle. This avoids the chicken-and-egg
# of compose validating an `external: true` network before it can run
# anything that would create it, and the upgrade-path label conflicts
# of compose trying to adopt a network it didn't originally create.
#
# Agent containers don't talk to the orchestrator over agent-network
# (the orchestrator drives them via the Docker socket); they only use
# it for outbound traffic to LLM endpoints and Forgejo.
#
# The bundled `forgejo` service runs on the compose default network, so
# agent containers couldn't resolve `forgejo:3000` over agent-network by
# default. At startup the orchestrator attaches the `forgejo` container to
# agent-network too (connectBundledForgejoToAgentNetwork() in docker.ts),
# giving it the `forgejo` DNS alias on that bridge so `git` over
# FORGEJO_URL=http://forgejo:3000 works from inside agent containers.

volumes:
  orchestrator-data:
  forgejo-data:
