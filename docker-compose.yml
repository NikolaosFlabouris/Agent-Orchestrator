# Before first boot:
#   1. cp .env.example .env  and fill in tokens / API keys
#   2. docker compose up -d --build      (builds the orchestrator image,
#                                         builds the agent image
#                                         `orchestrator-agent:latest`, creates
#                                         the agent-network bridge, and
#                                         starts the orchestrator — first boot
#                                         seeds providers/models/default profile)
# See docs/quick-start.md for the full bring-up procedure.

services:
  # Build-only service. Produces the `orchestrator-agent:latest` image that
  # the orchestrator spawns task containers from at run-time. The container
  # itself executes `true` and exits 0 immediately — we only care about the
  # image being tagged in Docker's local image store. The orchestrator
  # service `depends_on` this with `service_completed_successfully`, so
  # `docker compose up -d --build` blocks on the build before starting the
  # orchestrator. Prevents the "no such image: orchestrator-agent:latest"
  # 404 that used to bite operators who hadn't run the separate build
  # script before `compose up`.
  #
  # Use `docker compose build agent-image` to force-rebuild without
  # touching the running orchestrator (e.g. after editing
  # images/agent/Dockerfile or harness/*).
  agent-image:
    image: orchestrator-agent:latest
    build:
      context: .
      dockerfile: images/agent/Dockerfile
    command: ["true"]
    restart: "no"

  orchestrator:
    build: .
    container_name: orchestrator
    restart: unless-stopped
    # stop_grace_period must be >= agent_timeout_minutes + a few minutes of drain slack.
    # If you raise agent_timeout_minutes in the UI, raise this too and `docker compose up -d`.
    stop_grace_period: 35m
    # Default to a loopback publish so an unconfigured instance can't be
    # reached from the LAN. The orchestrator itself also forces a
    # 127.0.0.1 bind inside the container when auth is disabled OR the
    # cookie secret is the dev fallback (see packages/server/src/index.ts
    # resolveBindHost) — this compose-level loopback publish is the
    # belt-and-braces layer for the case where someone misconfigures one
    # of those checks.
    #
    # To expose to the LAN (multi-user install with OAuth configured),
    # change to:
    #   - "0.0.0.0:8081:8080"
    # and also set ORCHESTRATOR_BIND_HOST=0.0.0.0 in .env. Both layers
    # must opt in; either one alone keeps you on loopback.
    ports:
      - "0.0.0.0:8081:8080"
    # Wait for the agent-image build to complete before the orchestrator
    # boots. If we didn't, the orchestrator could come up and accept task
    # creations before the agent image was tagged, and the first task to
    # try to launch would 404. service_completed_successfully treats the
    # one-shot `true` exit as the unblock signal.
    depends_on:
      agent-image:
        condition: service_completed_successfully
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - orchestrator-data:/data
      # /workspaces and /caches are bind mounts (NOT named volumes) because the
      # orchestrator passes its in-container `/workspaces/issue-N` path through
      # the Docker socket as the source of agent-container bind mounts. The
      # Docker daemon interprets that source as a HOST path. With a named
      # volume, the host has no `/workspaces/...` and Docker silently creates
      # an empty directory — agents launch with an empty /repo and immediately
      # fail. With a bind mount, the orchestrator's `/workspaces` is the same
      # filesystem path on the host, so the agent sees the actual workspace.
      # The host directories are gitignored.
      - ./workspaces:/workspaces
      - ./caches:/caches
    env_file:
      - .env
    networks:
      - default
      - agent-network

networks:
  # Shared bridge network for orchestrator <-> agent containers. Compose-
  # managed (not `external: true`) so a fresh clone of the repo can run
  # `docker compose up -d --build` without a separate `docker network
  # create agent-network` step. The literal `name:` keeps it as the bare
  # string `agent-network` rather than the compose-project-prefixed name
  # (compose's default), since the orchestrator's docker.ts hardcodes
  # this network name when spawning agent containers.
  #
  # `ensureAgentNetwork()` in packages/server/src/docker.ts is still the
  # safety net: it (re)creates the network at orchestrator startup if it
  # was somehow removed while the orchestrator was down.
  agent-network:
    name: agent-network
    driver: bridge

volumes:
  orchestrator-data:
